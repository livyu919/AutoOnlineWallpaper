name: Build Tweak

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup RootHide Theos
        uses: beerpiss/theos-action@v1
        with:
          theos-src: 'https://github.com/roothide/theos'   # 必须使用 RootHide 专属 Theos
          theos-sdks: 'https://github.com/DavidDev42/sdks'  # 提供 iOS 16/17 最新 SDK

      - name: Build RootHide deb package
        run: |
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoOnlineWallpaper-iOS17-RootHide
          path: packages/*.deb
          if-no-files-found: error
