name: Build Tweak
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Theos
        uses: theos/build-action@v3
        with:
          scheme: roothide
          sdk: 17.0

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: AutoOnlineWallpaper-deb
          path: packages/*.deb
