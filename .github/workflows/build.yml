name: Build Tweak
on: [push]

permissions:
  contents: read  # 关键修复：授予读取仓库文件权限

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          
      - uses: theos/build-action@v2
        with:
          scheme: roothide
          sdk: 17.0
          
      - uses: actions/upload-artifact@v4
        with:
          name: com.user.autoonlinewallpaper
          path: packages/*.deb
